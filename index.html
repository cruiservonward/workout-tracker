<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2563eb">
    <meta name="description" content="Track your garage workouts">
    <title>Garage Workout Tracker</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 20px; min-height: 100vh; color: #333; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: linear-gradient(135deg,#667eea,#764ba2); }
        .container { max-width: 600px; margin: auto; }
        header { text-align: center; color: white; margin-bottom: 22px; }
        h1 { margin: 0 0 6px; }
        .card { padding: 20px; margin-bottom: 16px; border-radius: 16px; background: white; box-shadow: 0 8px 28px #0002; }
        button, input, select { font: inherit; }
        button { padding: 12px; border: 0; border-radius: 10px; cursor: pointer; }
        .wake { width: 100%; margin-bottom: 16px; color: white; background: #2563eb; font-weight: 600; }
        .wake[aria-pressed="true"] { background: #059669; }
        #wake-status { min-height: 1.4em; margin: -8px 0 14px; color: white; text-align: center; font-size: .9em; }
        .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
        .tabs button { flex: 1; background: white; }
        .tabs button.active { color: white; background: #764ba2; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        label { display: block; margin: 12px 0 6px; font-weight: 600; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 9px; }
        .weight-unit-options { display: flex; gap: 20px; margin: 8px 0 12px; }
        .weight-unit-options label { display: flex; align-items: center; gap: 6px; margin: 0; font-weight: normal; cursor: pointer; }
        .weight-unit-options input { width: 18px; height: 18px; margin: 0; padding: 0; }
        .primary { width: 100%; margin-top: 16px; color: white; background: #667eea; }
        .item { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid #eee; }
        .muted { color: #777; }
        .small { padding: 7px 10px; color: white; background: #ef4444; }
        .empty { padding: 22px 0; text-align: center; color: #888; }
        @media (max-width: 420px) { body { padding: 12px; } .card { padding: 16px; } }
    </style>
</head>
<body>
    <main class="container">
        <header><h1>💪 Workout Tracker</h1><p>Track your garage gains</p></header>
        <button id="wake-toggle" class="wake" type="button" aria-pressed="false">Keep Screen Awake</button>
        <p id="wake-status" aria-live="polite">Tap to keep your screen on during a workout.</p>
        <nav class="tabs" aria-label="Workout sections">
            <button type="button" class="active" data-tab="log">Log Workout</button>
            <button type="button" data-tab="history">History</button>
            <button type="button" data-tab="stats">Stats</button>
        </nav>
        <section id="log" class="tab-content active">
            <div class="card">
                <label for="exercise">Exercise</label><select id="exercise"></select>
                <label for="reps">Reps or minutes</label><input id="reps" type="number" min="1" inputmode="numeric" placeholder="Enter a number">
                <label for="weight">Weight (optional)</label><input id="weight" type="number" min="0" step="5" inputmode="decimal" placeholder="Enter weight">
                <span style="display: block; margin-top: 12px; font-weight: 600">Weight unit</span>
                <div class="weight-unit-options" role="radiogroup" aria-label="Weight unit">
                    <label><input type="radio" name="weight-unit" value="lbs" checked> Lbs</label>
                    <label><input type="radio" name="weight-unit" value="plates"> Plates</label>
                </div>
                <button id="add-workout" class="primary" type="button">Add Set</button>
            </div>
            <div class="card"><h2>Today's Session</h2><div id="today-list"></div></div>
            <div class="card"><h2>Exercise Management</h2><label for="new-exercise">Add an exercise</label><input id="new-exercise" placeholder="Exercise name"><button id="add-exercise" class="primary" type="button">Add Exercise</button></div>
        </section>
        <section id="history" class="tab-content"><div class="card"><h2>Workout History</h2><div id="history-list"></div></div></section>
        <section id="stats" class="tab-content"><div class="card"><h2>Stats</h2><p>Total sets: <strong id="total-workouts">0</strong></p><p>Total reps/minutes: <strong id="total-reps">0</strong></p><div id="exercise-breakdown"></div></div></section>
    </main>
<script>
    let workouts = JSON.parse(localStorage.getItem('workouts') || '[]');
    let exercises = JSON.parse(localStorage.getItem('exercises') || 'null') || [
        'Bench Press', 'Cable Fly', 'Incline Press', 'Lat Pull Down Behind', 'Lat Pull Down Infront',
        'Cable Rows', 'Face Pull Down', 'Crunch', 'Barbell Curl', 'Cable Curl', 'Tricep Rope Pulldown',
        'Tricep Barbell Pulldown', 'Shoulder Barbell Lift', 'Shoulder Cable Pull', 'Leg Extension',
        'Calves', 'Incline Bike (min)', 'Elliptical (min)'
    ];
    const exerciseSelect = document.getElementById('exercise');
    const wakeButton = document.getElementById('wake-toggle');
    const wakeStatus = document.getElementById('wake-status');
    let wakeLock = null;
    let wakeLockRequested = false;

    function getWeightUnit() {
        return document.querySelector('input[name="weight-unit"]:checked').value;
    }
    function saveData() {
        localStorage.setItem('workouts', JSON.stringify(workouts));
        localStorage.setItem('exercises', JSON.stringify(exercises));
        localStorage.setItem('weightUnit', getWeightUnit());
    }
    function updateExerciseOptions() {
        const selected = exerciseSelect.value;
        exerciseSelect.replaceChildren(new Option('Select exercise...', ''));
        exercises.forEach(name => exerciseSelect.add(new Option(name, name)));
        if (exercises.includes(selected)) exerciseSelect.value = selected;
    }
    function render() {
        const today = new Date().toDateString();
        const todaysWorkouts = workouts.filter(w => new Date(w.timestamp).toDateString() === today);
        const renderItems = items => items.length ? items.map(w => `<div class="item"><span><strong>${escapeHtml(w.exercise)}</strong><br><span class="muted">${new Date(w.timestamp).toLocaleString()}</span></span><span>${w.reps} ${w.weight ? `· ${w.weight} ${escapeHtml(w.unit || 'lbs')}` : ''}</span><button class="small" type="button" data-delete="${w.id}" aria-label="Delete workout">×</button></div>`).join('') : '<p class="empty">No workouts yet.</p>';
        document.getElementById('today-list').innerHTML = renderItems(todaysWorkouts);
        document.getElementById('history-list').innerHTML = renderItems(workouts);
        document.getElementById('total-workouts').textContent = workouts.length;
        document.getElementById('total-reps').textContent = workouts.reduce((sum, w) => sum + (Number(w.reps) || 0), 0);
        const counts = {};
        workouts.forEach(w => counts[w.exercise] = (counts[w.exercise] || 0) + 1);
        document.getElementById('exercise-breakdown').innerHTML = Object.entries(counts).map(([name, count]) => `<p>${escapeHtml(name)}: ${count} sets</p>`).join('') || '<p class="empty">Log workouts to see a breakdown.</p>';
    }
    function escapeHtml(value) {
        const el = document.createElement('span');
        el.textContent = String(value);
        return el.innerHTML;
    }

    document.querySelectorAll('.tabs button').forEach(button => button.addEventListener('click', () => {
        document.querySelectorAll('.tabs button').forEach(tab => tab.classList.toggle('active', tab === button));
        document.querySelectorAll('.tab-content').forEach(section => section.classList.toggle('active', section.id === button.dataset.tab));
    }));
    document.getElementById('add-workout').addEventListener('click', () => {
        const reps = parseInt(document.getElementById('reps').value, 10);
        if (!exerciseSelect.value || !reps || reps < 1) { alert('Please select an exercise and enter reps.'); return; }
        const weight = parseFloat(document.getElementById('weight').value) || null;
        workouts.unshift({ id: Date.now(), exercise: exerciseSelect.value, reps, weight, unit: getWeightUnit(), timestamp: new Date().toISOString() });
        saveData(); render();
        document.getElementById('reps').value = '';
        document.getElementById('weight').value = '';
    });
    document.querySelectorAll('input[name="weight-unit"]').forEach(radio => {
        radio.addEventListener('change', () => localStorage.setItem('weightUnit', getWeightUnit()));
    });
    document.getElementById('add-exercise').addEventListener('click', () => {
        const input = document.getElementById('new-exercise');
        const name = input.value.trim();
        if (!name || exercises.includes(name)) return;
        exercises.push(name); exercises.sort(); saveData(); updateExerciseOptions(); exerciseSelect.value = name; input.value = '';
    });
    document.addEventListener('click', event => {
        const deleteButton = event.target.closest('[data-delete]');
        if (deleteButton) { workouts = workouts.filter(w => String(w.id) !== deleteButton.dataset.delete); saveData(); render(); }
    });

    async function requestWakeLock() {
        if (!wakeLockRequested || document.visibilityState !== 'visible') return;
        if (!('wakeLock' in navigator)) {
            wakeStatus.textContent = 'Screen Wake Lock is not available in this browser. Keep the page open and adjust Auto-Lock in iPhone Settings if needed.';
            wakeButton.setAttribute('aria-pressed', 'false');
            wakeButton.textContent = 'Keep Screen Awake (unavailable)';
            wakeLockRequested = false;
            return;
        }
        try {
            wakeLock = await navigator.wakeLock.request('screen');
            wakeButton.setAttribute('aria-pressed', 'true');
            wakeButton.textContent = 'Stop Keeping Screen Awake';
            wakeStatus.textContent = 'Screen will stay awake while this page is visible.';
            wakeLock.addEventListener('release', () => {
                wakeLock = null;
                if (wakeLockRequested && document.visibilityState === 'visible') requestWakeLock();
            }, { once: true });
        } catch (error) {
            wakeLock = null;
            wakeLockRequested = false;
            wakeButton.setAttribute('aria-pressed', 'false');
            wakeButton.textContent = 'Keep Screen Awake';
            wakeStatus.textContent = error.name === 'NotAllowedError'
                ? 'Allow screen wake in your browser settings, then try again.'
                : 'Could not keep the screen awake. Try again while the page is active.';
        }
    }
    wakeButton.addEventListener('click', async () => {
        if (wakeLockRequested) {
            wakeLockRequested = false;
            if (wakeLock) { await wakeLock.release(); wakeLock = null; }
            wakeButton.setAttribute('aria-pressed', 'false');
            wakeButton.textContent = 'Keep Screen Awake';
            wakeStatus.textContent = 'Tap to keep your screen on during a workout.';
        } else {
            wakeLockRequested = true;
            await requestWakeLock();
        }
    });
    document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible' && wakeLockRequested && !wakeLock) requestWakeLock();
    });
    const savedUnit = localStorage.getItem('weightUnit');
    if (savedUnit && ['lbs', 'plates'].includes(savedUnit)) {
        document.querySelector(`input[name="weight-unit"][value="${savedUnit}"]`).checked = true;
    }
    updateExerciseOptions();
    render();
</script>
</body>
</html>
